name: Set up Postgres + PostGIS + pgRouting for the my_ai role
description: >
  Installs Postgres, PostGIS, and pgRouting on the runner and creates a superuser
  role named my_ai with no password, matching every DSN hardcoded
  throughout this repo's test suites (test/helpers.js's ADMIN_DSN,
  tests/conftest.py's ADMIN_DSN) -- both assume a local Unix-socket
  connection as a role called exactly "my_ai", peer-authenticated on the
  dev machine this repo was built on. Peer auth checks the connecting
  OS user's name against the requested role name, which wouldn't match
  on a GitHub-hosted runner (whose default user is "runner", not
  "my_ai") -- rather than creating a matching Linux user or an ident
  map, this just switches local auth to "trust" for every role. That's
  fine here because the runner is a fresh, single-job, throwaway VM with
  no other tenants -- the same shortcut would be a real problem on a
  shared or long-lived box.
runs:
  using: composite
  steps:
    # DEBIAN_FRONTEND/NEEDRESTART_MODE avoid a real failure mode, not a
    # hypothetical one: needrestart (present by default on recent Ubuntu)
    # can prompt interactively about restarting services when a package
    # like postgresql installs one, and on a runner with no TTY that
    # prompt just hangs forever instead of failing -- silently burning
    # the job's whole time budget. `sudo -n` on every sudo call below is
    # the same fail-fast instinct for a different prompt: GitHub-hosted
    # runners' default user has passwordless sudo, so this should never
    # actually block, but if that ever stopped being true, -n turns a
    # hang into an immediate, legible failure instead.
    - name: Install Postgres, PostGIS, and pgRouting
      shell: bash
      env:
        DEBIAN_FRONTEND: noninteractive
        NEEDRESTART_MODE: a
      run: |
        set -euo pipefail
        sudo -n apt-get update
        sudo -n apt-get install -y postgresql postgresql-contrib
        PGV=$(pg_lsclusters | awk 'NR==2 {print $1}')
        sudo -n apt-get install -y "postgresql-${PGV}-postgis-3" "postgresql-${PGV}-pgrouting"
        echo "PGV=$PGV" >> "$GITHUB_ENV"

    # Installing the postgresql package doesn't start the cluster on this
    # runner image (unlike a normal Debian/Ubuntu box, where the postinst
    # script starts it automatically) -- pg_ctlcluster is the same tool
    # postgresql-common's own postinst would have used, so this is just
    # doing explicitly what didn't happen implicitly. Polls for the socket
    # rather than trusting pg_ctlcluster's own exit code, since a "started"
    # result doesn't guarantee the socket is accepting connections yet.
    - name: Start Postgres
      shell: bash
      run: |
        set -euo pipefail
        sudo -n pg_ctlcluster "$PGV" main start
        for i in $(seq 1 30); do
          [ -S /var/run/postgresql/.s.PGSQL.5432 ] && exit 0
          sleep 1
        done
        echo "Postgres did not come up within 30s" >&2
        sudo -n pg_lsclusters
        exit 1

    - name: Switch local auth to trust and create the my_ai superuser role
      shell: bash
      run: |
        set -euo pipefail
        HBA_FILE=$(sudo -n -u postgres psql -tAc "SHOW hba_file;")
        sudo -n sed -i -E 's/(peer|md5|scram-sha-256)$/trust/' "$HBA_FILE"
        sudo -n pg_ctlcluster "$PGV" main restart
        sudo -n -u postgres createuser -s my_ai

[project]
name = "geocoding"
version = "0.1.0"
description = "Custom address geocoding engine built on TIGER/Line street data"
requires-python = ">=3.10"
dependencies = [
    "pyshp>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geocoding*"]

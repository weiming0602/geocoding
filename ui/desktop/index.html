<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meridian — Maine &amp; New Hampshire Address Geocoding API</title>
    <meta
      name="description"
      content="Meridian is a small, focused geocoding service built specifically for Maine and New Hampshire — not a one-size-fits-all national platform. The kind of local knowledge you'd trust from a local real estate agency, applied to precise address data."
    />
    <!-- Link-preview URLs are the geocoding site's; the Road Alerts build
         swaps them for its own domain (vite.config.ts). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Meridian" />
    <meta property="og:title" content="Meridian — Maine &amp; New Hampshire Address Geocoding API" />
    <meta
      property="og:description"
      content="A small, focused geocoding service built specifically for Maine and New Hampshire — the kind of local knowledge you'd trust from a local real estate agency, applied to precise address data."
    />
    <meta property="og:url" content="https://www.meridiangeocoding.com/" />
    <meta property="og:image" content="https://www.meridiangeocoding.com/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Meridian — Maine &amp; New Hampshire Address Geocoding API" />
    <meta
      name="twitter:description"
      content="A small, focused geocoding service built specifically for Maine and New Hampshire — the kind of local knowledge you'd trust from a local real estate agency, applied to precise address data."
    />
    <meta name="twitter:image" content="https://www.meridiangeocoding.com/icons/icon-512.png" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Service",
        "name": "Meridian Geocoding",
        "serviceType": "Address geocoding API",
        "description": "A small, focused geocoding service built specifically for Maine and New Hampshire — not a one-size-fits-all national platform.",
        "areaServed": [
          { "@type": "State", "name": "Maine" },
          { "@type": "State", "name": "New Hampshire" }
        ],
        "provider": { "@type": "Organization", "name": "Meridian" }
      }
    </script>

    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2a52d" />
    <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- iOS ignores the manifest's display mode; these are what actually
         make "Add to Home Screen" launch standalone (no Safari chrome)
         and set the status bar style for that standalone window. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Meridian" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Shared with the service worker (public/sw.js): draws the hazard
         sketch on Road Alerts cards and notifications. Plain script, so it
         must load before the app module that uses window.RoadAlertSketch. -->
    <script src="/alert-sketch.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
